# INKOS 1 Pro - 1-bit pixel diffusion model for manga-style illustration.
id: inkos1_pro
name: INKOS 1 Pro
architecture: bit-diffusion-unet
summary: >-
  Denoises a 256 x 256 one-bit image from noise under text guidance, then a
  learned refiner doubles it to 512 and 1024. Built for line art, screentone
  and panel layouts. Needs a GPU to train in reasonable time.
specialties: [manga characters, comic panels and pages, line art, environments, illustration]

# Training target requested for this model. This is a goal, not a claim:
# the number of epochs actually completed is recorded by the trainer.
target_epochs: 20000

model:
  base_resolution: 256
  patch: 4                         # pixels folded 4 x 4 -> the U-Net runs on a 64 x 64 grid
  channels: [64, 128, 256, 384]
  blocks_per_level: 2
  attn_levels: [2, 3]              # self + cross attention at 16 x 16 and 8 x 8 (and in the middle)
  heads: 8
  text_dim: 320
  text_layers: 4
  text_heads: 8
  max_prompt: 192
  self_cond: true
  refiner_channels: 64
  refiner_blocks: 8
  dropout: 0.0

data:
  count: 60000                     # procedural manga images to generate
  val_count: 1000
  resolution: 512                  # stored size; the base model trains on the 2x reduction
  shard_size: 1000
  seed: 2
  binarize: otsu                   # for imported artwork: otsu | fixed

train:
  batch_size: 16                   # raise on a GPU (32-64 fits in 12 GB)
  lr: 2.0e-4
  min_lr: 2.0e-5
  warmup_steps: 200
  schedule_epochs: null
  weight_decay: 0.01
  betas: [0.9, 0.99]
  grad_clip: 1.0
  ema_decay: 0.9995
  caption_dropout: 0.1             # enables classifier-free guidance
  self_cond_prob: 0.5
  refiner_crop: 128
  refiner_crops: 1
  log_every: 10
  val_every_steps: 500
  val_batches: 6
  checkpoint_minutes: 10
  keep_checkpoints: 2
  seed: 2

sample:
  steps: 32
  guidance: 3.0
  preview_steps: 16

inference:
  sizes: [256, 512, 1024]          # 256 native; 512 and 1024 through the refiner
  default_size: 512

preview_prompts:
  - "manga portrait, girl, long black hair, straight bangs, smiling, sailor uniform"
  - "manga portrait, boy, spiky black hair, spiky bangs, angry, school jacket, speed lines"
  - "manga background, city street, perspective"
  - "manga page, 4 panels, girl with twin tails black hair, speech bubbles"
